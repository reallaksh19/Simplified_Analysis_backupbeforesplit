name: Non-FEA Piping Input Checker

on:
  push:
    branches:
      - feat/pre-fea-input-checker-foundation
    paths:
      - 'src/core/pre-fea-piping-checker/**'
      - 'src/pre-fea-checker/**'
      - 'src/App.jsx'
      - 'src/components/TopNav.jsx'
      - 'scripts/pre-fea-piping-checker-*.mjs'
      - 'e2e/pre-fea-piping-input-checker.spec.js'
      - '.github/workflows/pre-fea-piping-checker.yml'
  pull_request:
    paths:
      - 'src/core/pre-fea-piping-checker/**'
      - 'src/pre-fea-checker/**'
      - 'src/App.jsx'
      - 'src/components/TopNav.jsx'
      - 'scripts/pre-fea-piping-checker-*.mjs'
      - 'e2e/pre-fea-piping-input-checker.spec.js'
      - '.github/workflows/pre-fea-piping-checker.yml'

concurrency:
  group: non-fea-piping-checker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit without marketplace actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "+${GITHUB_REF}:${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
      - name: Runtime information
        run: node --version
      - name: Enforce Non-FEA dependency boundary
        run: node scripts/pre-fea-piping-checker-scope-guard.mjs
      - name: Core Non-FEA contract checks
        run: node scripts/pre-fea-piping-checker-contract-check.mjs
      - name: Workspace preview and qualification checks
        run: node scripts/pre-fea-piping-checker-workspace-check.mjs
      - name: Install application dependencies
        run: npm ci --ignore-scripts
      - name: Build application consumer
        run: npm run build
