name: LFEA-007 implementation publisher

on:
  push:
    branches:
      - agent/lfea-007-application-consumer
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@v4
        with:
          ref: agent/lfea-007-application-consumer
          fetch-depth: 0
      - name: Verify and extract implementation payload
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/lfea-007-bootstrap-part-{00..04}.txt | base64 --decode > /tmp/lfea007-impl.tar.gz
          echo "08f0e44ada2b4db6b43838eef37431ab6ffb28c2cc706119f45239a353a43d02  /tmp/lfea007-impl.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/lfea007-impl.tar.gz -C .
          rm scripts/lfea-007-bootstrap-part-{00..04}.txt
      - name: Publish exact implementation head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(lfea-007): implement read-only Local FEA application consumer"
          git push origin HEAD:agent/lfea-007-application-consumer
