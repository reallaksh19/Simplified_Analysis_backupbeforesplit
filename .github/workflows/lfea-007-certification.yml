name: LFEA-007 certification

on:
  push:
    branches:
      - agent/lfea-007-application-consumer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@v4
      - name: Capture repository workspace
        uses: actions/upload-artifact@v4
        with:
          name: lfea-007-workspace
          path: .
          include-hidden-files: true
          retention-days: 1
