name: MASR-01 Branch Bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/masr-01-shell-icon-navigation
          fetch-depth: 2
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Determine whether materialization is required
        id: gate
        run: |
          if test -f src/core/application-tabs/constants.js; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Assemble branch payload diagnostics
        if: steps.gate.outputs.needed == 'true'
        run: |
          set +e
          {
            head -c 7600 .masr-bootstrap/part-00.txt
            head -c 7600 .masr-bootstrap/part-01.txt
            head -c 7600 .masr-bootstrap/part-02.txt
            head -c 7600 .masr-bootstrap/part-03.txt
            head -c 104 .masr-bootstrap/part-04.txt
          } > /tmp/masr-01-payload.b64
          {
            find .masr-bootstrap -type f -maxdepth 1 -printf '%f %s\n' | sort
            echo "payload_bytes=$(wc -c < /tmp/masr-01-payload.b64)"
            echo "payload_sha=$(sha256sum /tmp/masr-01-payload.b64 | cut -d' ' -f1)"
            base64 --decode /tmp/masr-01-payload.b64 > /tmp/masr-01-payload.tar.xz
            echo "decode_status=$?"
            echo "archive_bytes=$(wc -c < /tmp/masr-01-payload.tar.xz)"
            echo "archive_sha=$(sha256sum /tmp/masr-01-payload.tar.xz | cut -d' ' -f1)"
          } > /tmp/masr-01-payload-diagnostics.txt 2>&1
          cat /tmp/masr-01-payload-diagnostics.txt
      - name: Upload branch payload diagnostics
        if: steps.gate.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: masr-01-branch-payload-diagnostics
          path: /tmp/masr-01-payload-diagnostics.txt
          retention-days: 1
      - name: Verify branch payload identity
        if: steps.gate.outputs.needed == 'true'
        run: |
          test "$(wc -c < /tmp/masr-01-payload.b64)" = '30504'
          echo '308a95904cad355c666d4b13ff3e298a0e1010b7354b7d0fdc3c12b2a5af5244  /tmp/masr-01-payload.b64' | sha256sum --check
          echo '5fab19a846c031ea9eb94410b554c6c7130f58b5a8435c8c30b4bc5df0c0f8e8  /tmp/masr-01-payload.tar.xz' | sha256sum --check
      - name: Extract reviewed product source tree
        if: steps.gate.outputs.needed == 'true'
        run: tar --exclude='./.github' -xJf /tmp/masr-01-payload.tar.xz
      - name: Restore exact package and add MASR-01 commands
        if: steps.gate.outputs.needed == 'true'
        run: |
          git fetch origin 7e12954f2923c2df574bf94cb0d94811c813d463 --depth=1
          git show 7e12954f2923c2df574bf94cb0d94811c813d463:package.json > /tmp/package.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const packageJson=JSON.parse(fs.readFileSync('/tmp/package.json','utf8'));
          Object.assign(packageJson.scripts,{
            'check:masr.01:contracts':'node scripts/masr-01-shell-contract-check.mjs',
            'check:masr.01:properties':'node scripts/masr-01-shell-property-check.mjs',
            'check:masr.01:source':'node scripts/masr-01-shell-source-guard.mjs && node scripts/masr-01-registration-check.mjs',
            'check:masr.01:browser':'playwright test e2e/masr-01-shell-navigation.spec.js',
            'check:masr.01':'npm run check:masr.01:contracts && npm run check:masr.01:properties && npm run check:masr.01:source && npm run check:masr.01:browser',
          });
          fs.writeFileSync('package.json',`${JSON.stringify(packageJson,null,2)}\n`);
          NODE
      - name: Commit reviewed implementation
        if: steps.gate.outputs.needed == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m 'feat(masr-01): recover shell icon and navigation integrity'
          git push origin HEAD:agent/masr-01-shell-icon-navigation
      - run: npm ci
        if: steps.gate.outputs.needed == 'true'
      - name: Run early MASR-01 static certification
        if: steps.gate.outputs.needed == 'true'
        run: |
          npm run check:masr.01:contracts
          npm run check:masr.01:properties
          npm run check:masr.01:source
      - name: Build production shell
        if: steps.gate.outputs.needed == 'true'
        env:
          VITE_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run build
      - name: Upload exact workspace
        if: steps.gate.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: masr-01-bootstrap-workspace
          path: .
          include-hidden-files: true
          retention-days: 1
